<!DOCTYPE html>
<html>
<head>
    <title>Simple Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f5f5f5;
        }

        .login-box {
            width: 350px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
            font-size: 16px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .meme {
            margin-top: 20px;
            width: 300px;
            max-width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Simple Login</h2>

    <form method="POST">

        <input
            type="password"
            name="password"
            maxlength="3"
            minlength="3"
            pattern="[0-9]{3}"
            placeholder="Enter 3-digit password"
            required
        >

        <br>

        <button type="submit">Login</button>

    </form>

    {% if message %}

        {% if success %}

            <h3 class="success">{{ message }}</h3>

            <img
                src="{{ url_for('static', filename='hello.jpeg') }}"
                class="meme"
                alt="Hello!"
            >

        {% else %}

            <h3 class="error">{{ message }}</h3>

            <img
                src="{{ url_for('static', filename='wrong.jpeg') }}"
                class="meme"
                alt="Hehehe"
            >

        {% endif %}

    {% endif %}

</div>

</body>
</html>
